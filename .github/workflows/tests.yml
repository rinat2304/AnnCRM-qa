name: API Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anncrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d anncrm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        working-directory: .
        run: |
          pip install -r requirements.txt

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: rinat2304/AnnCRM-backend
          path: backend

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anncrm_test
          SECRET_KEY: test-secret-key
        run: |
          alembic upgrade head

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anncrm_test
          SECRET_KEY: test-secret-key
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            curl --fail http://127.0.0.1:8000/docs && exit 0
            sleep 1
          done
          echo "Backend did not start"
          cat backend/backend.log
          exit 1

      - name: Create test users
        env:
          BASE_URL: http://127.0.0.1:8000
          TEST_EMAIL: qa_test@example.com
          TEST_PASSWORD: qa_test_password
          SECOND_TEST_EMAIL: qa_test2@example.com
          SECOND_TEST_PASSWORD: qa_test2_password
        run: |
          python tests/api/setup_test_users.py

      - name: Run API tests
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          pytest tests/api -v