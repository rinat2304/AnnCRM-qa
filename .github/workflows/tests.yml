name: API Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anncrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d anncrm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          pip install -r requirements.txt

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: rinat2304/AnnCRM-backend
          path: backend

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anncrm_test
          SECRET_KEY: test-secret-key
        run: |
          alembic upgrade head

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anncrm_test
          SECRET_KEY: test-secret-key
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8000/docs > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi

            echo "Waiting for backend..."
            sleep 1
          done

      - name: Create test users
        run: |
          curl -f -X POST http://127.0.0.1:8000/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"qaz","email":"qaz@qaz.qaz","password":"qazqaz"}'

          curl -f -X POST http://127.0.0.1:8000/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"user","email":"user@example.com","password":"string"}'

      - name: Run API tests
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          pytest tests/api -v